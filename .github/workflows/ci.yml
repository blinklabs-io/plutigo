# Managed locally so reusable workflow revisions are reviewed with this repository.
name: "ci"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@d3aa875070b18acdcb31256100558d44c16b512f
    with:
      nilaway-exclude-file-docstrings: <nilaway skip stack-machine>
      nilaway-include-pkgs: github.com/blinklabs-io/plutigo
      pre-test-command: make test
      run-golangci-lint: true
      run-nilaway: true
      submodules: true
      test-flags: -race -coverprofile=coverage.out -covermode=atomic
      upload-coverage: true
  publish:
    needs: [go-test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-library-release.yml@d3aa875070b18acdcb31256100558d44c16b512f
    permissions:
      contents: write
