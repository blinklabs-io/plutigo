# Generated automatically by org-governance-bot. Do not edit manually.
name: "ci"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - v*.*.*
  workflow_dispatch:

jobs:
  go-test:
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main
    with:
      nilaway-exclude-file-docstrings: <nilaway skip stack-machine>
      nilaway-include-pkgs: github.com/blinklabs-io/plutigo
      pre-test-command: make test
      run-golangci-lint: true
      run-nilaway: true
      submodules: true
      test-flags: -race -coverprofile=coverage.out -covermode=atomic
      upload-coverage: true
  publish:
    needs: [go-test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-library-release.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
